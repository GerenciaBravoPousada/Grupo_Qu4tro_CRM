  <title>GRUPO QU4TRO • Redirecionando</title>
  <script>
    (function(){
      var p = (window.location.pathname || '').toLowerCase();
      if (p.indexOf('iconi') !== -1) {
        window.location.replace('/?public=iconiko');
      } else if (p.indexOf('lena') !== -1 || p.indexOf('le%c3%b1a') !== -1 || p.indexOf('leña') !== -1) {
        window.location.replace('/?public=lena');
      } else if (p.indexOf('bravo') !== -1 || p.indexOf('cafe') !== -1 || p.indexOf('caf%c3%a9') !== -1) {
        window.location.replace('/?public=cafe');
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
